server {
    listen 80;
    server_name hellocs.site www.hellocs.site api.hellocs.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hellocs.site www.hellocs.site;

    ssl_certificate     /etc/letsencrypt/live/hellocs.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hellocs.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /grafana/ {
        proxy_pass        http://grafana:3000/;
        proxy_set_header  Host             $host;
        proxy_set_header  X-Real-IP        $remote_addr;
    }

    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.hellocs.site;

    ssl_certificate     /etc/letsencrypt/live/hellocs.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hellocs.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass        http://app:8080;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }
}